services:
  wanderlog-postgres-db:
    image: postgres:15
    container_name: wanderlog-postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Talha8293.
      POSTGRES_DB: postgres
    # Portları sildik, sadece backend ağına dahil ettik
    networks:
      - backend-network
    restart: always

  wanderlog-mongodb:
    image: mongo:6.0
    container_name: wanderlog-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: adminpassword123
    networks:
      - backend-network
    restart: always
    volumes:
      - mongo_data:/data/db

  wanderlog-mariadb:
    image: mariadb:10.11
    container_name: wanderlog-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword123
      MARIADB_DATABASE: okul_sistemi
    networks:
      - backend-network
    restart: always
    volumes:
      - mariadb_data:/var/lib/mysql

  wanderlog-redis-cache:
    image: redis:alpine
    container_name: wanderlog-redis-cache
    networks:
      - backend-network
    restart: always

  wanderlog-python-app:
    build: .
    container_name: wanderlog-python-app
    depends_on:
      - wanderlog-postgres-db
      - wanderlog-redis-cache
    networks:
      - backend-network
    restart: always

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    ports:
      - "9000:9000" # Arayüzü kullanabilmek için açık kalmalı
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - frontend-network
      - backend-network
    restart: always

  airflow-standalone:
    image: apache/airflow:2.7.0
    container_name: airflow-standalone
    restart: always
    environment:
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - _PIP_ADDITIONAL_REQUIREMENTS=apache-airflow-providers-mysql redis
    ports:
      - "8080:8080" # Web arayüzü için açık kalmalı
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
    networks:
      - frontend-network # Bizim erişimimiz için
      - backend-network # Veritabanlarına erişebilmesi için
    command: standalone

  elasticsearch:
    image: elasticsearch:8.10.2
    container_name: elasticsearch-lab
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    networks:
      - backend-network
    volumes:
      - es_data:/usr/share/elasticsearch/data

  kibana:
    image: kibana:8.10.2
    container_name: kibana-lab
    ports:
      - "5601:5601" # Web arayüzü için açık kalmalı
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - frontend-network
      - backend-network

  filebeat:
    image: elastic/filebeat:8.10.2
    container_name: filebeat-lab
    user: root
    volumes:
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - elasticsearch
      - kibana
    networks:
      - backend-network

# Ağ tanımlamaları
networks:
  frontend-network:
    driver: bridge
  backend-network:
    driver: bridge

volumes:
  es_data:
  mongo_data:
  mariadb_data:
