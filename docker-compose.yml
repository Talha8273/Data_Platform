services:
  wanderlog-consumer-app:
    build: ./consumer_app
    container_name: wanderlog-consumer-app
    depends_on:
      - wanderlog-postgres-db
      - kafka-lab
    networks:
      - backend
      - data
    secrets:
      - postgres_password
    restart: always

  wanderlog-postgres-db:
    image: postgres:15
    container_name: wanderlog-postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: postgres
    networks:
      - data
    secrets:
      - postgres_password
    restart: always

  wanderlog-mongodb:
    image: mongo:6.0
    container_name: wanderlog-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_password
    networks:
      - data
    secrets:
      - mongo_password
    restart: always
    volumes:
      - mongo_data:/data/db

  wanderlog-mariadb:
    image: mariadb:10.11
    container_name: wanderlog-mariadb
    environment:
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/mariadb_password
      MARIADB_DATABASE: okul_sistemi
    networks:
      - data
    secrets:
      - mariadb_password
    restart: always
    volumes:
      - mariadb_data:/var/lib/mysql

  wanderlog-redis-cache:
    image: redis:alpine
    container_name: wanderlog-redis-cache
    networks:
      - data
    restart: always

  wanderlog-python-app:
    build: .
    container_name: wanderlog-python-app
    depends_on:
      - wanderlog-postgres-db
      - wanderlog-redis-cache
    networks:
      - backend
      - data
    restart: always

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - frontend
      - backend
    restart: always

  airflow-standalone:
    image: apache/airflow:2.7.0
    container_name: airflow-standalone
    restart: always
    environment:
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - _PIP_ADDITIONAL_REQUIREMENTS=apache-airflow-providers-mysql redis
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
    networks:
      - frontend
      - backend
      - data
    command: standalone

  elasticsearch:
    image: elasticsearch:8.10.2
    container_name: elasticsearch-lab
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    networks:
      - data
    volumes:
      - es_data:/usr/share/elasticsearch/data

  kibana:
    image: kibana:8.10.2
    container_name: kibana-lab
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - frontend
      - data

  filebeat:
    image: elastic/filebeat:8.10.2
    container_name: filebeat-lab
    user: root
    volumes:
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - elasticsearch
      - kibana
    networks:
      - backend
      - data

  nginx-proxy:
    image: nginx:latest
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - kibana
      - airflow-standalone
    networks:
      - frontend

  kafka-lab:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: kafka-lab
    command:
      - redpanda
      - start
      - --smp 1
      - --memory 512M
      - --reserve-memory 0M
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:29092,external://0.0.0.0:9092
      - --advertise-kafka-addr internal://kafka-lab:29092,external://192.168.10.200:9092
    ports:
      - "9092:9092"
    networks:
      - backend
      - data
    restart: always

  kafka-ui-lab:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui-lab
    environment:
      - DYNAMIC_CONFIG_ENABLED=true
      - KAFKA_CLUSTERS_0_NAME=Lab-Cluster
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka-lab:29092
    networks:
      - frontend
      - backend
    depends_on:
      - kafka-lab
    restart: always

  prometheus-lab:
    image: prom/prometheus:latest
    container_name: prometheus-lab
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - backend
    restart: always

  grafana-lab:
    image: grafana/grafana:latest
    container_name: grafana-lab
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - frontend
      - backend
    depends_on:
      - prometheus-lab
    restart: always

  cadvisor-lab:
    image: gcr.io/cadvisor/cadvisor:v0.47.0
    container_name: cadvisor-lab
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - backend
    restart: always

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
  data:
    driver: bridge
    internal: true

volumes:
  es_data:
  mongo_data:
  mariadb_data:
  grafana_data:

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  mariadb_password:
    file: ./secrets/mariadb_password.txt
  mongo_password:
    file: ./secrets/mongo_password.txt
