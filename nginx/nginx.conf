events {
    worker_connections 1024;
}

http {
    # Varsayılan Karşılama: Sadece sunucu IP'sini yazarsak Grafana açılsın
    server {
        listen 80 default_server;
        
        location / {
            proxy_pass http://grafana-lab:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # Kafka UI Yönlendirmesi (Eğer kafka.lab.local adresi kullanılıyorsa)
    server {
        listen 80;
        server_name kafka.lab.local;

        location / {
            proxy_pass http://kafka-ui-lab:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
